name: Kiểm tra

on:
  push:
    branches: ["main", "phase-*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - run: uv sync --locked
      - run: uv run --locked ruff check backend tests
      - run: uv run --locked mypy backend tests
      - run: uv run --locked pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
