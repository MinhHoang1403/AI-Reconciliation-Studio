# Một bộ duy nhất 3 container. Chỉ frontend (Nginx) được mở ra máy, và chỉ trên 127.0.0.1.
name: ai-reconciliation-studio

services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_DB: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Cần POSTGRES_PASSWORD trong .env}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        STUDIO_REVISION: ${STUDIO_REVISION:-unknown}
    image: ai-reconciliation-studio-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://studio:${POSTGRES_PASSWORD}@postgres/studio
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # Langfuse chạy ở bộ container riêng trên máy; từ trong container đi qua host.docker.internal.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_DOCKER_URL:-http://host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - files:/data/files
      # Cấu hình nghiệp vụ: sửa tệp trong config/ rồi `docker compose restart backend` (config/README.md).
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: ai-reconciliation-studio-frontend:local
    ports:
      - "127.0.0.1:18180:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  database:
  files:
