server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Tệp tải lên lớn (từ Giai đoạn 1); giới hạn cụ thể sẽ chốt khi làm chức năng tải tệp.
    client_max_body_size 50m;

    include /etc/nginx/security-headers.conf;

    # Mọi lời gọi /api đi tới backend trong mạng nội bộ của Docker.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # Lưu ý: location nào có add_header riêng thì KHÔNG kế thừa add_header của server, nên
    # mỗi location dưới đây include lại các header bảo mật.

    # Tệp đã build có mã băm trong tên nên cache lâu được.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Ứng dụng một trang: mọi đường dẫn khác trả về index.html. index.html luôn phải hỏi lại
    # máy chủ (no-cache) để sau mỗi lần cập nhật trình duyệt nhận đúng bản mới, không giữ
    # bản cũ trỏ tới tệp JS cũ.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
}
