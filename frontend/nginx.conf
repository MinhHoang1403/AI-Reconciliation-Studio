server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Tệp tải lên lớn (từ Giai đoạn 1); giới hạn cụ thể sẽ chốt khi làm chức năng tải tệp.
    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Mọi lời gọi /api đi tới backend trong mạng nội bộ của Docker.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # Tệp đã build có mã băm trong tên nên cache lâu được.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Ứng dụng một trang: mọi đường dẫn khác trả về index.html.
    location / {
        try_files $uri /index.html;
    }
}
