log_format studio '$request_method $uri $status';
server {
    listen 8080 default_server;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log studio;
    error_log /var/log/nginx/error.log crit;
    client_max_body_size 205m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /health {
        access_log off;
        add_header X-Studio-Instance $hostname always;
        return 200 'ok';
    }
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header Connection '';
        proxy_read_timeout 125s;
        proxy_request_buffering off;
        proxy_http_version 1.1;
    }
    location / { try_files $uri $uri/ /index.html; }
}
