# Header bảo mật dùng chung cho mọi location (nginx: location có add_header riêng thì không
# kế thừa add_header của server, nên mỗi location include tệp này).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
# Chống nhúng trang vào khung của trang khác (clickjacking). X-Frame-Options cho trình duyệt cũ,
# frame-ancestors trong CSP cho trình duyệt mới (OWASP Clickjacking Defense Cheat Sheet).
add_header X-Frame-Options DENY always;
# CSP: chỉ chạy script, font, ảnh của chính ứng dụng (font Be Vietnam Pro tự host); gọi API cùng
# địa chỉ. 'unsafe-inline' chỉ cho style vì vài thành phần đặt style trực tiếp; script thì không.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
