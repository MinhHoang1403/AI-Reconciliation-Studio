[project]
name = "ai-reconciliation-studio"
version = "0.1.0"
description = "Hệ thống đối soát dữ liệu kết hợp AI (bản demo)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "sqlalchemy",
  "psycopg[binary]",
  "polars>=2.1.0",
  "fastexcel>=0.21.0",
  "python-multipart>=0.0.34",
  "alembic>=1.20.1",
  "google-genai>=3.6.1",
  "langfuse>=5.2.0",
  "rapidfuzz>=3.14.6",
  "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "httpx",
    "xlsxwriter>=3.3.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend", "tests", "tools"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["studio"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
strict = true
plugins = ["pydantic.mypy"]

# xlsxwriter (sinh tệp Excel mẫu, test) và scipy không kèm khai báo kiểu cho mypy.
[[tool.mypy.overrides]]
module = ["xlsxwriter", "scipy", "scipy.*"]
ignore_missing_imports = true
