[project]
name = "ai-reconciliation-studio"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic-settings",
  "sqlalchemy",
  "psycopg[binary]",
  "alembic",
  "polars",
  "fastexcel",
  "openpyxl",
  "httpx",
  "python-multipart",
  "defusedxml",
  "duckdb==2.0.0",
  "rapidfuzz==3.14.6",
  "pytz==2026.5",
]

[dependency-groups]
dev = ["pytest", "hypothesis", "ruff", "mypy", "types-openpyxl"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
markers = ["integration: isolated PostgreSQL integration", "live: explicit synthetic Qwen inference"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastexcel.*", "defusedxml.*"]
ignore_missing_imports = true
